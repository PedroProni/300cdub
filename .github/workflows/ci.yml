name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back/application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/application/package-lock.json
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
  front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 57001:27017
    defaults:
      run:
        working-directory: back/application
    steps:
      - run: docker run -d --name minio -p 57003:9000 -e MINIO_ROOT_USER=cdubminio -e MINIO_ROOT_PASSWORD=cdubminio-secret minio/minio server /data
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/application/package-lock.json
      - run: npm ci
      - run: npm run test:e2e
  ci:
    needs: [back, front, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          [ "${{ needs.back.result }}" = "success" ] && [ "${{ needs.front.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ]
