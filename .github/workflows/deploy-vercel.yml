name: Publicar na Vercel

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CDUB_DEMO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Definir o autor do commit aceito pela Vercel
        env:
          VERCEL_COMMIT_EMAIL: ${{ secrets.VERCEL_COMMIT_EMAIL }}
        run: |
          git config user.email "$VERCEL_COMMIT_EMAIL"
          git config user.name "deploy"
          git commit --amend --reset-author --no-edit --allow-empty
      - name: Publicar
        id: deploy
        working-directory: front
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes --meta githubCommitSha="$GITHUB_SHA")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Conferir a publicação
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for I in $(seq 1 30); do
            INFO=$(npx --yes vercel@latest inspect "$DEPLOY_URL" 2>&1 || true)
            if echo "$INFO" | grep -q "Ready" && echo "$INFO" | grep -q "https://cdub-demo.proni.dev"; then
              CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://cdub-demo.proni.dev/?ci=$GITHUB_SHA")
              [ "$CODE" = "200" ] && echo "publicação confere" && exit 0
            fi
            sleep 6
          done
          echo "publicação não confere"
          exit 1
